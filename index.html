<title>2kfashion | Men's Fashion Sri Lanka</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Layout: editorial storefront (announcement bar, sticky nav, split hero, product grids) plus a separate admin shell with sidebar. */
:root{
  --bg:#F7F7F7;--surface:#FFFFFF;--ink:#111111;--muted:#6a6862;--line:#e3e0da;
  --gold:#C6A96B;--goldink:#85692d;--on-ink:#FFFFFF;--bar:#111111;--soft:#efece6;
  --ok:#2f7a4d;--warn:#a46a12;--bad:#b3392f;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
  --shadow:0 14px 40px rgba(0,0,0,.09);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e0e;--surface:#171717;--ink:#f2efe8;--muted:#9c9890;--line:#2b2a28;
  --gold:#C6A96B;--goldink:#C6A96B;--on-ink:#111111;--bar:#000000;--soft:#1f1e1c;
  --ok:#5bbf86;--warn:#d9a24a;--bad:#e5766c;--shadow:0 14px 40px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0e0e;--surface:#171717;--ink:#f2efe8;--muted:#9c9890;--line:#2b2a28;
  --gold:#C6A96B;--goldink:#C6A96B;--on-ink:#111111;--bar:#000000;--soft:#1f1e1c;
  --ok:#5bbf86;--warn:#d9a24a;--bad:#e5766c;--shadow:0 14px 40px rgba(0,0,0,.5);color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:30}
a{color:inherit;text-decoration:none}
img{display:block}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.08;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--goldink);font-weight:500}
.bar{background:var(--bar);color:var(--gold);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;padding:10px 0;text-align:center}
.bar span{display:inline-block;transition:opacity .4s}
/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:22px;height:70px}
.logo{font-family:var(--serif);font-size:25px;letter-spacing:.34em;font-weight:600;white-space:nowrap}
.logo i{font-style:normal;color:var(--gold)}
.links{display:flex;gap:22px;margin-left:auto;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
.links a{padding:6px 0;border-bottom:1px solid transparent;transition:border-color .2s,color .2s}
.links a:hover,.links a.on{border-color:var(--gold);color:var(--goldink)}
.soc{display:flex;gap:6px;align-items:center}
.soc a{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;transition:background .2s,color .2s}
.soc a:hover{background:var(--ink);color:var(--on-ink)}
.soc svg,.ico{width:18px;height:18px}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);width:42px;height:42px;border-radius:50%;cursor:pointer}
.wa{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--gold);color:var(--goldink);padding:9px 16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;transition:background .2s,color .2s}
.wa:hover{background:var(--gold);color:#111}
@media (max-width:1060px){
  .burger{display:block}.nav .wa,.nav .soc{display:none}
  .links{display:none;position:absolute;left:0;right:0;top:70px;background:var(--surface);flex-direction:column;gap:0;padding:8px max(16px,env(safe-area-inset-left,0px)) 18px;border-bottom:1px solid var(--line);margin:0}
  .nav.open .links{display:flex}.links a{padding:13px 0;border-bottom:1px solid var(--line)}
}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .2s;font-weight:500}
.btn:hover{background:transparent;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}.btn.ghost:hover{background:var(--ink);color:var(--on-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#111}.btn.gold:hover{background:transparent;color:var(--goldink)}
.btn.sm{padding:10px 14px;font-size:11px;letter-spacing:.12em}
.btn.red{background:var(--bad);border-color:var(--bad);color:#fff}.btn.red:hover{background:transparent;color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
/* hero */
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding-top:56px;padding-bottom:64px}
.hero h1{font-size:clamp(46px,6.6vw,88px);letter-spacing:-.01em;margin:18px 0 22px;animation:rise .9s both}
.hero h1 em{color:var(--goldink);font-style:italic}
.hero p.lead{max-width:46ch;color:var(--muted);font-size:17px;animation:rise .9s .12s both}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;animation:rise .9s .24s both}
.hero-art{position:relative;animation:rise 1s .1s both}
.hero-art .main{width:100%;aspect-ratio:4/5;object-fit:cover;box-shadow:var(--shadow)}
.hero-art::before{content:"";position:absolute;inset:22px -18px -18px 22px;border:1px solid var(--gold);z-index:-1}
.hero-art .mini{position:absolute;left:-28px;bottom:36px;width:34%;aspect-ratio:4/5;object-fit:cover;border:6px solid var(--bg);box-shadow:var(--shadow)}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:40px}.hero-art{margin:0 18px 18px 0}.hero-art .mini{left:-8px}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* sections */
.sec{padding:60px 0}.sec.alt{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:30px}
.sec-h h2{font-size:clamp(32px,4vw,48px);margin-top:8px}
.link-u{font-size:12px;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid var(--gold);padding-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px 22px}
.card{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;transition:box-shadow .25s,transform .25s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-3px)}
.card-img{position:relative;display:block;overflow:hidden;background:var(--soft)}
.card-img img{width:100%;aspect-ratio:4/5;object-fit:cover;transition:transform .6s}
.card:hover .card-img img{transform:scale(1.04)}
.tags{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tag{font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:5px 9px;background:var(--ink);color:var(--on-ink);font-weight:500}
.tag.gold{background:var(--gold);color:#111}.tag.out{background:var(--bad);color:#fff}
.card-b{padding:16px 16px 18px;display:flex;flex-direction:column;gap:9px;flex:1}
.card-b h3{font-size:22px}
.price{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-weight:500}
.price s{color:var(--muted);font-weight:400;font-size:13px}.price b{color:var(--goldink)}
.meta{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.sw{display:flex;gap:5px}.sw i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);display:block}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:6px}
.acts .btn{padding:10px 6px;font-size:10.5px;letter-spacing:.1em;text-align:center}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.cat{position:relative;overflow:hidden;background:var(--soft);aspect-ratio:1/1.1;display:block}
.cat img{width:100%;height:100%;object-fit:cover;transition:transform .6s}.cat:hover img{transform:scale(1.06)}
.cat span{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.62));color:#fff;font-family:var(--serif);font-size:24px}
@media (max-width:900px){.cats{grid-template-columns:repeat(2,1fr)}}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.colc{position:relative;min-height:210px;padding:24px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center;overflow:hidden;transition:transform .3s}
.colc:hover{transform:translateY(-3px)}
.colc::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,rgba(0,0,0,.65))}
.colc>*{position:relative;z-index:1}.colc h3{font-size:30px}.colc small{letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--gold)}
@media (max-width:900px){.cols{grid-template-columns:1fr 1fr}}@media (max-width:560px){.cols{grid-template-columns:1fr}}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.offer{background:var(--ink);color:var(--on-ink);padding:30px;display:flex;flex-direction:column;gap:14px;background-size:cover;position:relative;overflow:hidden}
.offer .pct{font-family:var(--serif);font-size:76px;line-height:.9;color:var(--gold)}
.offer h3{font-size:28px}.offer .ex{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.offer .btn{align-self:flex-start;background:var(--gold);border-color:var(--gold);color:#111}
.about{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
.about img{width:100%;aspect-ratio:1/1;object-fit:cover}
.about h2{font-size:clamp(34px,4vw,54px);margin:10px 0 18px}.about p+p{margin-top:14px}.about p{color:var(--muted);max-width:60ch}
.phil{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px}
.phil div{border-top:1px solid var(--gold);padding-top:12px;font-size:13px;color:var(--muted)}.phil b{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);font-weight:500}
@media (max-width:860px){.about{grid-template-columns:1fr;gap:30px}.phil{grid-template-columns:1fr}}
.gal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.gal a{display:block;overflow:hidden;aspect-ratio:1/1;background:var(--soft)}.gal img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.gal a:hover img{transform:scale(1.08)}
@media (max-width:900px){.gal{grid-template-columns:repeat(3,1fr)}}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:40px}
@media (max-width:860px){.contact{grid-template-columns:1fr}}
.clist{display:grid;gap:18px;margin-top:22px}.clist div{display:grid;grid-template-columns:110px 1fr;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
.clist dt,.clist b{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--goldink);font-weight:500}
.clist span{white-space:pre-line;min-width:0;overflow-wrap:anywhere}
.mapbox{position:relative;border:1px solid var(--line);background:var(--soft);min-height:300px;overflow:hidden}
.mapbox svg{width:100%;height:100%;position:absolute;inset:0}
.mapbox .cap{position:absolute;left:14px;right:14px;bottom:14px;background:var(--surface);border:1px solid var(--line);padding:14px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.mapbox .cap div{min-width:0}
/* footer */
footer{background:var(--bar);color:#d9d5cc;padding:56px 0 28px;margin-top:0}
footer .fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:36px}
footer h4{font-family:var(--sans);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;font-weight:500}
footer a{display:block;padding:3px 0;opacity:.85}footer a:hover{opacity:1;color:var(--gold)}
footer .logo{color:#fff;margin-bottom:12px;display:block}footer p{font-size:14px;opacity:.75;max-width:34ch}
footer .soc{margin-top:16px}footer .soc a{display:grid;padding:0;color:#fff;border:1px solid #333}footer .soc a:hover{background:var(--gold);color:#111}
.copy{border-top:1px solid #2a2a2a;margin-top:36px;padding-top:20px;font-size:12px;opacity:.7;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:860px){footer .fg{grid-template-columns:1fr 1fr}}@media (max-width:520px){footer .fg{grid-template-columns:1fr}}
/* pages */
.crumb{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:26px 0 8px}.crumb a:hover{color:var(--goldink)}
.ph{padding:30px 0 10px}.ph h1{font-size:clamp(38px,5vw,64px)}.ph p{color:var(--muted);margin-top:10px;max-width:60ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 28px}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 14px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.chip.on,.chip:hover{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.pd{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;padding:10px 0 50px}
.pd .main{width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--soft)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.thumbs button{padding:0;border:1px solid var(--line);background:none;cursor:pointer;overflow:hidden}.thumbs button.on{border-color:var(--gold);outline:1px solid var(--gold)}
.thumbs img{width:100%;aspect-ratio:1/1;object-fit:cover}
.pd h1{font-size:clamp(36px,4.4vw,56px);margin:8px 0 10px}
.pd .price{font-size:24px;margin:10px 0 18px}.pd .price s{font-size:16px}
.opt{margin:20px 0}.opt h4{font-family:var(--sans);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px;font-weight:500}.opt h4 span{color:var(--muted);letter-spacing:.05em;text-transform:none}
.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{min-width:48px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:center;font-size:13px}
.pill.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.cdot{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0;position:relative}.cdot.on{outline:2px solid var(--gold);outline-offset:3px}
.stock{display:inline-flex;align-items:center;gap:8px;font-size:13px}.stock::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.stock.low::before{background:var(--warn)}.stock.none::before{background:var(--bad)}
.specs{border-top:1px solid var(--line);margin-top:26px}.specs div{display:grid;grid-template-columns:130px 1fr;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.specs b{font-weight:500;color:var(--muted)}
.buy{display:grid;gap:10px;margin-top:6px}.buy .btn{padding:17px}
@media (max-width:860px){.pd{grid-template-columns:1fr;gap:30px}}
.enq{background:var(--surface);border:1px solid var(--line);padding:24px}
.enq h3{font-size:28px;margin-bottom:6px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:560px){.fg2{grid-template-columns:1fr}}
label.f{display:grid;gap:6px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
label.f.full{grid-column:1/-1}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);padding:11px 12px;font-size:14px;letter-spacing:0;text-transform:none;border-radius:0}
textarea{resize:vertical;min-height:90px}
input[type=checkbox]{width:auto}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink)}
.note{font-size:12.5px;color:var(--muted)}
/* toast + modal */
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:90;max-width:min(360px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--on-ink);padding:13px 16px;font-size:14px;border-left:4px solid var(--gold);box-shadow:var(--shadow);animation:rise .3s both}.toast.err{border-color:var(--bad)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--surface);width:100%;max-width:720px;border:1px solid var(--line);margin:auto 0}
.mbox>header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.mbox h3{font-size:26px}.mb{padding:22px;display:grid;gap:14px}
.x{background:none;border:0;font-size:26px;cursor:pointer;line-height:1}
.mfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
/* admin */
.adm{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;background:var(--bg)}
.side{background:var(--bar);color:#d9d5cc;padding:24px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;align-self:start;min-height:100vh}
.side .logo{color:#fff;font-size:20px;padding:0 10px 4px}.side small{padding:0 10px 18px;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-size:10.5px}
.side button{background:none;border:0;color:inherit;text-align:left;padding:11px 12px;cursor:pointer;font-size:14px;border-left:2px solid transparent}
.side button:hover{background:#1b1b1b}.side button.on{background:#1b1b1b;border-color:var(--gold);color:#fff}
.side .who{margin-top:auto;padding:14px 10px 0;border-top:1px solid #2a2a2a;font-size:12.5px}
.amain{padding:30px max(22px,env(safe-area-inset-right,0px)) 60px 30px;min-width:0}
.amain h1{font-size:40px;margin-bottom:6px}.amain>p.muted{margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.stat{background:var(--surface);border:1px solid var(--line);padding:16px}.stat b{display:block;font-family:var(--serif);font-size:40px;font-weight:500;line-height:1}.stat span{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);padding:20px;margin-bottom:22px;min-width:0}
.panel h3{font-size:26px;margin-bottom:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500}
th,td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}td img{width:44px;height:55px;object-fit:cover}
.pillst{display:inline-block;padding:3px 9px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line)}
.pillst.ok{color:var(--ok);border-color:var(--ok)}.pillst.warn{color:var(--warn);border-color:var(--warn)}.pillst.bad{color:var(--bad);border-color:var(--bad)}
.tg{border:1px solid var(--line);background:none;padding:3px 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin:0 3px 3px 0}.tg.on{background:var(--gold);border-color:var(--gold);color:#111}
.rowa{display:flex;gap:6px;flex-wrap:wrap}
.login{max-width:420px;margin:12vh auto;padding:34px;background:var(--surface);border:1px solid var(--line);display:grid;gap:16px}
.login h1{font-size:38px}
.demo{background:var(--soft);padding:12px;font-size:12.5px;color:var(--muted)}
.th{position:relative;display:inline-block;margin:0 8px 8px 0}.th img{width:84px;height:104px;object-fit:cover}
.th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;max-height:190px;overflow:auto;border:1px solid var(--line);padding:10px}
.ga{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
@media (max-width:900px){.adm{grid-template-columns:1fr}.side{position:static;min-height:0;flex-direction:row;flex-wrap:wrap;padding:14px}.side .logo,.side small{width:100%}.side .who{width:100%;margin-top:6px}.amain{padding:22px max(16px,env(safe-area-inset-left,0px))}}

[hidden]{display:none!important}
.links a{white-space:nowrap}.links{gap:18px}@media (max-width:1280px){.nav .wa{display:none}}
html{-webkit-text-size-adjust:100%}
.logo{text-transform:uppercase;letter-spacing:.2em;font-size:23px}
.bar-row{display:grid;grid-template-columns:minmax(120px,200px) 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar-row i{display:block;height:10px;background:var(--gold);min-width:2px}.bar-row b{text-align:right;font-weight:500}
.cdot[style*="cursor:default"]{cursor:default}
@media (max-width:520px){.logo{font-size:19px}.bar-row{grid-template-columns:1fr 1fr 40px}}

.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:560px;height:560px;right:-140px;top:-180px;background:radial-gradient(circle,rgba(198,169,107,.34),transparent 66%);animation:float 10s ease-in-out infinite;z-index:0;pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.hero-art{translate:0 var(--py,0px)}
.hero-art .mini{animation:bob 6s ease-in-out infinite}
.w{display:inline-block;opacity:0;transform:translateY(55%);animation:wd .85s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes wd{to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-34px,44px)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.pt{animation:fadein .6s both}
#pl{position:fixed;inset:0;z-index:200;background:#0b0b0b;display:grid;place-items:center;animation:plout .7s 1.6s forwards}
#pl b{font-family:var(--serif);color:#fff;font-size:clamp(34px,9vw,68px);font-weight:500;text-transform:uppercase;animation:plin 1.1s both}
#pl b i{color:var(--gold);font-style:normal}
#pl span{position:absolute;left:50%;top:58%;height:1px;width:0;background:var(--gold);transform:translateX(-50%);animation:plline 1.2s .3s forwards}
@keyframes plin{from{opacity:0;letter-spacing:.7em}to{opacity:1;letter-spacing:.28em}}
@keyframes plline{to{width:130px}}
@keyframes plout{to{opacity:0;visibility:hidden}}
.rv{opacity:0;transform:translateY(28px);transition:opacity .85s ease,transform .85s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.sec-h h2::after{content:"";display:block;width:64px;height:2px;background:var(--gold);margin-top:14px;transition:width .9s .3s}
.sec-h.rv:not(.in) h2::after{width:0}
.marq{background:var(--ink);color:var(--bg);overflow:hidden;white-space:nowrap;padding:15px 0;font-size:12px;letter-spacing:.28em;text-transform:uppercase}
.mq{display:inline-flex;animation:mq 38s linear infinite}
.marq:hover .mq{animation-play-state:paused}
.marq i{color:var(--gold);font-style:normal;margin:0 26px}
@keyframes mq{to{transform:translateX(-50%)}}
.strip{background:var(--surface);border-bottom:1px solid var(--line)}
.strip .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-top:38px;padding-bottom:38px;text-align:center}
.strip b{display:block;font-family:var(--serif);font-size:clamp(40px,7vw,64px);font-weight:500;line-height:1;color:var(--goldink)}
.strip span{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.card-img .alt{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.card:hover .card-img .alt{opacity:1}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.32) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s;pointer-events:none}
.btn:hover::after{transform:translateX(120%)}
.links a{border-bottom:0;background:linear-gradient(var(--gold),var(--gold)) 0 100%/0 2px no-repeat;transition:background-size .35s,color .2s}
.links a:hover,.links a.on{background-size:100% 2px;border-color:transparent}
.nav .wrap{transition:height .3s}.nav.sm .wrap{height:58px}.nav.sm{box-shadow:0 8px 30px rgba(0,0,0,.08)}
.cat span{transition:padding .35s}.cat:hover span{padding-bottom:22px}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.fab .ico{width:28px;height:28px}
.fab::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #25D366;animation:ring 2.2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.7);opacity:0}}
#toasts{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){#pl{display:none}.w{opacity:1!important;transform:none!important}.rv{opacity:1!important;transform:none!important}.mq{animation:none!important}}

function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML='';draft={images:[],banner:null,hero:null,id:null}}
function ask(msg,fn,label){pending=fn;modal('Please confirm','<p>'+esc(msg)+'</p><div class="mfoot"><button class="btn ghost sm" data-act="close">Cancel</button><button class="btn red sm" data-act="yes">'+esc(label||'Delete')+'</button></div>')}
function catName(slug){var c=DB.categories.filter(function(c){return c.slug===slug})[0];return c?c.name:slug}
function prod(id){return DB.products.filter(function(p){return p.id===id})[0]}
function activeOffers(){if(!CFG.offers)return [];var t=today();return DB.offers.filter(function(o){return o.active&&o.start<=t&&o.end>=t})}
function pinfo(p){var o=activeOffers().filter(function(o){return o.productIds.indexOf(p.id)>-1})[0],now=p.price,pct=0,end=null;
  if(o){pct=o.percent;now=Math.round(p.price*(1-pct/100)/10)*10;end=o.end}else if(p.sale&&p.sale<p.price){now=p.sale;pct=Math.round((1-p.sale/p.price)*100)}
  return {now:now,pct:pct,orig:p.price,end:end,on:now<p.price}}
function pastel(k){if(!CFG.bgs)return null;var h=0;for(var i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;return CFG.bgs[h%CFG.bgs.length]}
function imgs(p,hex){return p.images&&p.images.length?p.images:[0,1,2].map(function(v){return art(p.art,hex||p.colours[0].hex,v,pastel(p.id))})}

function countUp(el){var to=+el.dataset.count,t0=null;function step(t){if(!t0)t0=t;var p=Math.min(1,(t-t0)/1300);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)}
function fx(){
  onScroll();

  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  if(io)io.disconnect();
  io=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;var t=e.target;io.unobserve(t);t.classList.add('in');if(t.dataset.count)countUp(t);setTimeout(function(){t.classList.remove('rv');t.style.transitionDelay=''},1400)})},{threshold:.12,rootMargin:'0px 0px -40px 0px'});
  [].forEach.call(document.querySelectorAll('.card,.cat,.colc,.offer,.sec-h,.about>*,.gal a,.pd>*,.clist>div,.enq,.ph,.phil>div,.strip .wrap>div,.mapbox'),function(el,i){el.classList.add('rv');el.style.transitionDelay=((i%4)*90)+'ms';io.observe(el)});

  else{body=home()}

  var titles={product:'',shop:''};document.title=(r==='product'&&prod(rest)?prod(rest).name+' | ':'')+S().shopName+' Menswear';
  startBar();fx();

   DB.products.forEach(function(p){var has=p.collections.indexOf(c.id)>-1,want=ids.indexOf(p.id)>-1;if(want&&!has)p.collections.push(c.id);if(!want&&has)p.collections=p.collections.filter(function(x){return x!==c.id})});
   if(save()){closeModal();toast('Collection saved.');route(true)}},
 offer:function(f){var d=new FormData(f),t=String(d.get('title')||'').trim(),pc=Number(d.get('percent'));
   if(!t||!(pc>0&&pc<=90)){toast('Add a title and a discount between 1 and 90 percent.','err');return}
   if(d.get('end')<d.get('start')){toast('The end date must be on or after the start date.','err');return}
   var o=draft.id?DB.offers.filter(function(x){return x.id===draft.id})[0]:null;if(!o){o={id:uid('o')};DB.offers.push(o)}
   o.title=t;o.percent=pc;o.start=d.get('start');o.end=d.get('end');o.active=!!d.get('active');o.productIds=d.getAll('prod');o.banner=draft.banner;
   if(save()){closeModal();toast('Offer saved.');route(true)}},
 announce:function(f){var d=new FormData(f),t=String(d.get('text')||'').trim();if(!t){toast('Type the message first.','err');return}
   var a=draft.id?DB.announcements.filter(function(x){return x.id===draft.id})[0]:null;if(!a){a={id:uid('a')};DB.announcements.push(a)}a.text=t;a.active=!!d.get('active');
   if(save()){closeModal();toast('Announcement saved.');route(true)}},
 hero:function(f){var d=new FormData(f);DB.hero.eyebrow=d.get('eyebrow');DB.hero.headline=String(d.get('headline')||'').trim()||'Dressed with quiet confidence.';DB.hero.sub=d.get('sub');if(draft.hero)DB.hero.image=draft.hero;draft.hero=null;commit('Hero saved. Check the home page.')},
 titles:function(f){var d=new FormData(f);['newT','catT','colT','featT','bestT','offT','galT'].forEach(function(k){DB.titles[k]=d.get(k)||DB.titles[k]});commit('Headlines saved.')},
 about:function(f){var d=new FormData(f);DB.about.heading=d.get('heading');DB.about.story=d.get('story');DB.about.philosophy=d.get('philosophy');DB.about.pillars=String(d.get('pillars')).split('\n').map(function(x){return x.trim()}).filter(Boolean).slice(0,3);commit('About section saved.')},
 settings:function(f){var d=new FormData(f);['shopName','phone','whatsapp','email','address','mapsLink','hours','facebook','instagram','tiktok'].forEach(function(k){DB.settings[k]=String(d.get(k)||'').trim()});commit('Settings saved. Links and WhatsApp messages now use the new details.')},
 password:function(f){var d=new FormData(f);if(d.get('cur')!==A.user.pw){toast('Your current password is not correct.','err');return}
   if(String(d.get('nw')).length<8){toast('Use at least 8 characters for the new password.','err');return}
   A.user.pw=d.get('nw');DB.users.forEach(function(u){if(u.id===A.user.id)u.pw=A.user.pw});f.reset();if(save())toast('Password updated.')},
 newuser:function(f){var d=new FormData(f),em=String(d.get('email')||'').trim().toLowerCase();
   if(!d.get('name')||!em||String(d.get('pw')).length<8){toast('Add a name, an email and a password of 8+ characters.','err');return}
   if(DB.users.some(function(u){return u.email.toLowerCase()===em})){toast('That email already has an account.','err');return}
   DB.users.push({id:uid('u'),name:String(d.get('name')).trim(),email:em,role:d.get('role'),pw:d.get('pw')});if(save()){closeModal();toast('Staff account added.');route(true)}}
};
document.addEventListener('submit',function(e){var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();var fn=FORMS[f.dataset.form];if(fn)fn(f)});
route();
})();
</script>

</body>
